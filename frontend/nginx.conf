# nginx serving the SPA and reverse-proxying the API.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Uploads are bounded here as well as in the API (defence in depth).
  client_max_body_size 30m;

  # Security headers for the served SPA. The API sets its own on /api responses.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  server_tokens off;

  # API reverse proxy. Long read timeout: OCR of a multi-parcel sheet can take ~30 s.
  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
  }

  # Health/diagnostic passthroughs.
  location = /health { proxy_pass http://api:8000/health; }
  location = /livez  { proxy_pass http://api:8000/livez; }
  location = /readyz { proxy_pass http://api:8000/readyz; }

  # Long-cache fingerprinted assets; never cache index.html.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html { add_header Cache-Control "no-cache"; }

  location / { try_files $uri /index.html; }
}
