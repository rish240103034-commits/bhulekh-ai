# Render Blueprint — one-click deploy of Bhulekh-AI.
# https://render.com/docs/blueprint-spec
#
# What it provisions:
#   * a free PostgreSQL database, and
#   * one Docker web service (root Dockerfile) that serves BOTH the React SPA and the
#     FastAPI + OCR API on the same origin — so there is one public URL and no CORS.
#
# How to deploy:
#   1. Push this repo to GitHub (done).
#   2. On https://dashboard.render.com → New → Blueprint → connect this repo.
#   3. Render reads this file, provisions the DB + service, generates the secret,
#      builds the image (installs Tesseract + Poppler), and gives you a live URL.
#
# It runs in "staging" mode so the demo accounts are seeded and reviewers can log in
# immediately (admin / Admin@12345, verifier / Verify@12345, operator / Operate@12345,
# viewer / Viewer@12345). The security middleware (headers, rate limiting, hashed +
# rotated refresh tokens, upload hardening) is active in every environment. For a real
# production deployment, set BHULEKH_ENVIRONMENT=production and BHULEKH_SEED_DEMO_DATA=
# false, then bootstrap the first admin with `python -m app.cli create-admin`.

databases:
  - name: bhulekh-db
    plan: free
    databaseName: bhulekh
    user: bhulekh

services:
  - type: web
    name: bhulekh-ai
    runtime: docker
    plan: free                 # free tier spins down after ~15 min idle; first hit is slow
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /livez
    autoDeploy: true           # redeploy on every push to the connected branch
    envVars:
      - key: BHULEKH_ENVIRONMENT
        value: staging
      - key: BHULEKH_SECRET_KEY
        generateValue: true    # Render generates a strong secret and stores it
      - key: BHULEKH_DATABASE_URL
        fromDatabase:
          name: bhulekh-db
          property: connectionString
      - key: BHULEKH_SEED_DEMO_DATA
        value: "true"
      - key: BHULEKH_OCR_LANGUAGES
        value: eng+hin
      - key: BHULEKH_RATE_LIMIT_ENABLED
        value: "true"
      - key: BHULEKH_LOG_JSON
        value: "true"
